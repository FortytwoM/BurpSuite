services:
  burpsuite:
    build: .
    container_name: burpsuite-pro
    ports:
      - "127.0.0.1:5901:5901"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./burp_data:/app/burp_data
    environment:
      - LICENSE_NAME=${LICENSE_NAME:-User}
      - VNC_PASSWORD=${VNC_PASSWORD:-}
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    network_mode: bridge
    restart: unless-stopped
